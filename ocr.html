        [scaleSelect, singleLineCb].forEach((el) => el.addEventListener('change', saveSettings));

        // 分数框改动时，同步刷新成绩对比里的「新识别 分数 / 变化」列
        resultCells.score?.addEventListener('input', () => {
            if (!compareRow || !compareNewScoreEl) return;
            compareNewScoreEl.textContent = formatScore(String(resultCells.score.value).replace(/[^0-9]/g, ''));
            const tdDelta = compareNewScoreEl.closest('tr')?.querySelector('.cmpDelta');
            if (tdDelta) updateCompareDelta(tdDelta, compareOldScore, compareNewScoreEl);
        });

        ocrBtn.addEventListener('click', async () => {
            if (!imageBitmap) return;
            const uiLang = langSelect.value;
            const scale = Number(scaleSelect.value);
            const singleLine = singleLineCb.checked;

            ocrBtn.disabled = true;
            langSelect.disabled = true;
            scaleSelect.disabled = true;
            singleLineCb.disabled = true;

            const rawTexts = {};
            const scoreReport = [];
            let ocrTitleText = '';   // 归一化后的曲名（喂给曲目库匹配）
            let ocrDiffText = '';    // 归一化后的难度名
            try {
                for (const field of FIELDS) {
                    setResult(field.key, field.key === 'score' ? '' : '…');
                    setNote(field.key, '');
                    if (!field.enabled) {
                        setResult(field.key, '（未启用）');
                        rawTexts[field.key] = '';
                        continue;
                    }

                    // 字段自己指定语言就用它，否则跟随下拉框
                    const lang = field.lang || uiLang;
                    const engine = await ensureEngine(lang);

                    if (field.prep === 'score') {
                        const res = await recognizeScore(engine, lang, imageBitmap, field, scale, singleLine);
                        if (!res.winner) {
                            setResult(field.key, '');
                            setNote(field.key, `（${res.total} 次识别都没认出数字，请把选区收得更贴合数字后重试）`, 'note warn');
                            rawTexts[field.key] = res.details.map((d) => `${d.tag}：${d.raw || '(空)'}`).join('\n');
                            scoreReport.push({ field, res });
                            continue;
                        }
                        setResult(field.key, res.winner.groups.join("'"));
                        // 可信度：① 有「8 位 + 2/3/3」的合规读数；② 合规读数只有一种 → 最可信；
                        //         ③ 有多种时看票数是否过半。
                        const good = res.structurallyValid && (res.distinctValid === 1 || res.votes >= 2);
                        let note;
                        if (!res.structurallyValid) {
                            note = `（没得到 8 位 / 2+3+3 的合规读数（${res.votes}/${res.scope}），可靠性低，请核对）`;
                        } else if (res.distinctValid === 1) {
                            note = '（结构唯一匹配 ✓）';
                        } else {
                            note = `（${res.votes}/${res.scope} 一致${res.votes >= 2 ? '' : '，可靠性低，请核对'}｜合规读数 ${res.distinctValid} 种）`;
                        }
                        // 分隔符是补回来的（原文分组不是 2/3/3）→ 说明这一位有一定推断成分
                        if (res.winner.shape === 2) note = note.replace(/）$/, '｜分隔符自动补正）');
                        setNote(field.key, note, 'note ' + (good ? 'ok' : 'warn'));
                        rawTexts[field.key] = res.details
                            .map((d) => {
                                const flag = d.digits === res.winner.digits ? '  ← 采用' : (d.shape >= 2 ? '' : '  (结构不符)');
                                return `${d.tag}：${JSON.stringify(d.raw)} → ${d.groups.join("'") || '(空)'}${flag}`;
                            })
                            .join('\n');
                        scoreReport.push({ field, res });
                    } else if (field.key === 'diff') {
                        // 难度只可能是纯英文的固定难度名（没有数字/符号）：
                        // 直接把数字与符号剔掉，再和难度表比对收敛。
                        const r = await recognizePlain(engine, lang, imageBitmap, field, scale, singleLine);
                        const cleaned = (r.text || '').replace(/\s+/g, ' ').trim();
                        const d = normalizeDifficulty(cleaned);
                        rawTexts[field.key] = cleaned
                            ? cleaned + (d.matched && d.text !== cleaned ? `  → ${d.text}（比对难度表）` : '')
                            : '';
                        setResult(field.key, d.text || '(空)');
                        if (d.matched) ocrDiffText = d.text;
                        if (!cleaned) setNote(field.key, '（没认到文字，请核对选区）', 'note warn');
                        else if (d.matched) setNote(field.key, '（已按难度表规范化 ✓）', 'note ok');
                        else setNote(field.key, '（没匹配到已知难度名，请核对）', 'note warn');
                    } else {
                        const r = await recognizePlain(engine, lang, imageBitmap, field, scale, singleLine);
                        const cleaned = (r.text || '').replace(/\s+/g, ' ').trim();
                        rawTexts[field.key] = cleaned;
                        setResult(field.key, cleaned || '(空)');
                        if (field.key === 'title') ocrTitleText = cleaned;
                    }
                }

                // 曲名匹配：用识别到的曲名（+ 难度缩小范围）去曲目库里找候选
                renderMatches(matchSongs(ocrTitleText, ocrDiffText), ocrTitleText, ocrDiffText);

                rawOutput.textContent = FIELDS
                    .filter((f) => f.enabled)
                    .map((f) => {
                        const prepNote = f.prep === 'score'
                            ? '分数专用（极性修正 + 多参数 + 2/3/3 结构校验 + 形近字归一）'
                            : (f.key === 'diff' ? '原样裁剪 + 只留英文字母 + 比对难度表' : '原样');
                        const engineNote = `引擎：${f.lang || uiLang}｜处理：${prepNote}`;
                        return `【${f.label}】${engineNote}\n${rawTexts[f.key] || '(空)'}`;
                    })
                    .join('\n\n');

                const low = scoreReport.some((s) => s.res && s.res.winner && !(s.res.structurallyValid && (s.res.distinctValid === 1 || s.res.votes >= 2)));
                setStatus(
                    `识别完成 ✓${low ? '｜⚠️ 分数多次识别不一致，建议核对或手动改正' : ''}` +
                    `${engineVariablesUsable ? '' : '｜提示：单行模式未生效，详见控制台'}`
                );
            } catch (err) {
                console.error(err);
                setStatus('识别出错：' + err.message, true);
                rawOutput.textContent = String(err.stack || err);
                // 出错说明引擎状态可能已损坏，全部丢掉，下次点击重建
                for (const engine of engines.values()) { try { await engine.destroy(); } catch (_) { } }
                engines.clear();
            } finally {
                ocrBtn.disabled = false;
                langSelect.disabled = false;
                scaleSelect.disabled = false;
                singleLineCb.disabled = false;
            }
        });

        // 引擎常驻（避免每次识别都重新编译 wasm / 重载模型），离开页面时收尾
        window.addEventListener('beforeunload', () => { for (const engine of engines.values()) engine.destroy(); });

        // ── 初始化：先恢复上次保存的设置，再按最终状态构建选区 ────────────────
        const restored = restoreSettings();
        buildRegions();
        syncFieldToggles();
        if (restored) setStatus('已恢复上次保存的选区位置与设置');

        // 曲目库和图片无关，进页面就开始加载（不阻塞选区/OCR）
        loadSongLibrary();

        // 纯函数（分数/难度文本整理、相似度、曲目库派生）挂出来，方便自动化回归测试直接断言，
        // 不必依赖截图跑整条 OCR 流水线。对页面本身无副作用。
        window.__ocrInternals = {
            parseScore, normalizeDifficulty, DIFFICULTY_NAMES, SCORE_SHAPE, SCORE_DIGITS,
            buildSongLibrary, matchSongs, titleSimilarity, jaroWinkler, levenshtein,
            normalizeForMatch, diffLabel, DIFF_BY_RATING_CLASS,
            // 成绩缓存相关（对比 / 覆盖 / 新增）
            singleRating, loseScoreOf, formatScore, readScoreCache, findCachedIndex,
            DIFF_DISPLAY, SCORE_CACHE_KEY, SCORE_CACHE_VERSION,
            readConstantFrom, buildNewRecord, constantOverrideFor, readConstantOverrides,
            getLibrary: () => songLibrary,
            getLibraryState: () => libraryState,
            getSongConstants: () => songConstantsByIdx,
        };
    </script>
</body>
