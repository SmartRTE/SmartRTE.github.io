<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>成绩识图 - Arcaea 查分工具</title>
    <link rel="stylesheet" href="css/ocr.css">
    <link rel="stylesheet" href="css/scrollbar.css">
    <link rel="icon" href="favicon.ico">
    <script src="js/ocr-theme.js"></script>
</head>

<body>
    <div id="bg"></div>

    <header id="page-head">
        <h1>成绩识图<span class="brand-sub">Arcaea 结算截图 · 曲名 / 难度 / 分数</span></h1>
        <div id="head-actions">
            <button type="button" class="btn-secondary theme-toggle" id="theme-toggle-btn"
                onclick="toggleTheme()">🌙 深色</button>
        </div>
    </header>

    <main id="main-content">
        <div id="ocr-layout">

            <!-- ═══ 左栏：截图与选区 ═══ -->
            <section id="shot-panel">
                <!-- 原生 file input 保留原样（含 id）：自动化测试直接往这个节点塞文件 -->
                <input type="file" id="fileInput" accept="image/*" class="sr-only">

                <div id="shot-head">
                    <h2 class="panel-title">结算截图</h2>
                    <div id="shot-actions">
                        <label class="btn-primary" for="fileInput">选择截图</label>
                    </div>
                </div>

                <div id="stageEmpty">
                    <span class="stage-empty-icon">🖼</span>
                    <span>还没有载入截图<br>点上方「选择截图」选一张 Arcaea 结算图</span>
                </div>

                <div id="editor" hidden>
                    <div class="editorBar">
                        <div class="fieldToggles">
                            <label><input type="checkbox" data-field="title" checked><span class="dot"
                                    style="background:#185FA5"></span>曲名</label>
                            <label><input type="checkbox" data-field="diff" checked><span class="dot"
                                    style="background:#854F0B"></span>难度</label>
                            <label><input type="checkbox" data-field="score" checked><span class="dot"
                                    style="background:#0F6E56"></span>分数</label>
                        </div>
                        <!-- 画面缩放：没有鼠标的移动端全指靠这里 + 双指捏合 -->
                        <div class="zoomBar" id="zoomBar">
                            <button type="button" class="zoomBtn" id="zoomOut" aria-label="缩小画面">−</button>
                            <button type="button" class="zoomBtn zoomVal" id="zoomVal"
                                title="点击恢复为「适应宽度」">100%</button>
                            <button type="button" class="zoomBtn" id="zoomIn" aria-label="放大画面">＋</button>
                            <button type="button" class="zoomBtn zoomFit" id="zoomFit">适应</button>
                        </div>
                    </div>
                    <div id="stageWrap">
                        <div id="stage">
                            <img id="stageImg" alt="待识别图片">
                        </div>
                    </div>
                    <p class="hint small">
                        <strong>双指捏合 / Ctrl+鼠标滚轮可缩放图片</strong><br>
                        <strong>双击画面可快速切换自适应 / 2倍缩放</strong><br>
                        <strong>建议线框边缘不要跨多种颜色区域，否则识别率降低</strong>   
                    </p>
                </div>
            </section>

            <!-- ═══ 右栏：控制 / 选择 / 确认 ═══ -->
            <div id="ctrl-panel">

                <section class="panel">
                    <h2 class="panel-title">识别设置</h2>
                    <div id="ocrOptions">
                        <div class="opt opt-wide">
                            <span class="opt-label">曲名识别语言</span>
                            <select id="langSelect"></select>
                        </div>
                        <div class="opt">
                            <span class="opt-label">放大</span>
                            <select id="scaleSelect">
                                <option value="1" selected>1×</option>
                                <option value="2">2×</option>
                                <option value="3">3×</option>
                            </select>
                        </div>
                        <div class="opt opt-check">
                            <label class="check-label"><input type="checkbox" id="singleLine" checked> 单行识别</label>
                        </div>
                        <button id="resetBtn" class="btn-secondary" disabled>重置选区</button>
                    </div>
                </section>

                <section class="panel">
                    <button id="ocrBtn" class="btn-primary" disabled>识别所选区域</button>
                    <p id="status">请先选择一张图片</p>
                </section>

                <section class="panel">
                    <h2 class="panel-title">识别结果</h2>
                    <table id="resultTable">
                        <tbody>
                            <tr>
                                <th>曲名</th>
                                <td><span data-result="title">—</span> <span class="note" data-note="title"></span></td>
                            </tr>
                            <tr>
                                <th>难度</th>
                                <td>
                                    <span data-result="diff">—</span> <span class="note" data-note="diff"></span>
                                    <!-- 识别出的难度不在已知难度表内（或压根没认到 / 没启用）时才出现：
                                         让用户手动指定难度，并按该难度重新筛选曲名匹配候选。 -->
                                    <div class="manualDiff" id="manualDiffBox" hidden>
                                        <label class="manualDiffLabel" id="manualDiffLabel" for="manualDiffSelect">手动指定难度后重新筛选候选：</label>
                                        <div class="manualDiffRow">
                                            <select id="manualDiffSelect" aria-label="手动选择难度"></select>
                                            <button type="button" class="btn-secondary manualDiffClear" id="manualDiffClear"
                                                hidden>不限难度</button>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th>分数</th>
                                <td>
                                    <input type="text" data-result="score" placeholder="—" inputmode="numeric"
                                        aria-label="分数" title="分数框可直接编辑，认错时手动改一下即可">
                                    <span class="note" data-note="score"></span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>

                <section class="panel">
                    <h2 class="panel-title">曲名匹配 <span class="note" id="libStatus">曲目库加载中…</span></h2>
                    <div id="matchList" class="matchList"></div>
                </section>

                <section class="panel" id="comparePanel" hidden>
                    <h2 class="panel-title" id="compareTitle">成绩对比与写入</h2>
                    <div id="scoreCompare" class="compare" hidden></div>
                </section>

            </div>
        </div>

        <!-- ═══ 折叠区：排查用的原始文本 ═══ -->
        <details class="section">
            <summary>各区域原始文本与分数投票明细（用于排查识别问题）</summary>
            <div class="section-body">
                <pre id="rawOutput">—</pre>
            </div>
        </details>

    </main>

    <script type="module" src="js/ocr.js"></script>
</body>

</html>
